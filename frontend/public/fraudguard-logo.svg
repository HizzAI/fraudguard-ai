<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="50" y1="5" x2="50" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fGrad" x1="35" y1="30" x2="65" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Shield Base -->
  <path d="M50 8C73 15 88 18 88 18V48C88 72 50 92 50 92C50 92 12 72 12 48V18C12 18 27 15 50 8Z" fill="url(#shieldGrad)" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Stylized F / Circuit -->
  <path d="M40 32H62M40 32V68M40 50H54" stroke="url(#fGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Accents / Nodes -->
  <circle cx="62" cy="32" r="3" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="54" cy="50" r="3" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="40" cy="68" r="3" fill="#22d3ee" filter="url(#glow)"/>
  <path d="M 62 32 L 72 22" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="72" cy="22" r="1.5" fill="#22d3ee" />
</svg>
